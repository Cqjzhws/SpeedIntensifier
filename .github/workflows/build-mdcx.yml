name: Build mdcX Max (IPA)

on:
  workflow_dispatch:
  push:
    tags: [ 'mdcx-v*' ]

permissions:
  contents: write

jobs:
  build:
    name: Build mdcX Max IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build app & IPA
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          rm -rf build artifacts
          APP="build/mdcXMax.app"
          mkdir -p "$APP"

          clang -arch arm64 -O2 \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -fobjc-arc -fmodules \
            -framework Foundation -framework UIKit \
            -o "$APP/mdcXMax" mdcXMax/App/main.m mdcXMax/App/exploit.c

          cp mdcXMax/App/Info.plist "$APP/Info.plist"
          cp mdcXMax/App/AppIcon.png "$APP/AppIcon.png"
          for f in mdcXMax/App/Icon-*.png; do cp "$f" "$APP/$(basename $f)"; done
          codesign --force --sign - --entitlements mdcXMax/entitlements.plist "$APP"

          mkdir -p build/Payload artifacts
          cp -R "$APP" build/Payload/mdcXMax.app
          ( cd build && zip -qry ../artifacts/mdcXMax.ipa Payload -x "*.DS_Store" )
          echo "IPA size: $(du -h artifacts/mdcXMax.ipa | cut -f1)"

      - name: Verify artifacts
        run: |
          set -e
          ls -lh artifacts/
          unzip -l artifacts/mdcXMax.ipa
          file build/mdcXMax.app/mdcXMax

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mdcXMax-artifacts
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/mdcx-v')
        uses: softprops/action-gh-release@v2
        with:
          name: mdcX Max ${{ github.ref_name }}
          files: artifacts/mdcXMax.ipa
          generate_release_notes: true
