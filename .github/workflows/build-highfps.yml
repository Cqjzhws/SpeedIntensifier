name: Build HighFPS Max
on:
  push:
    tags: ['highfps-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build dylib
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p artifacts
          clang -arch arm64 -dynamiclib -O2 \
            -install_name @rpath/HighFPSMax.dylib \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -undefined dynamic_lookup -fobjc-arc \
            -framework Foundation -framework UIKit -framework QuartzCore \
            -o artifacts/HighFPSMax.dylib HighFPSMax/Tweak/HighFPSMax.m
          codesign --force --sign - artifacts/HighFPSMax.dylib
          echo "dylib: $(du -h artifacts/HighFPSMax.dylib | cut -f1)"

      - name: Build app & IPA
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          APP="build/HighFPSMax.app"
          rm -rf build
          mkdir -p "$APP"
          clang -arch arm64 -O2 -isysroot "$SDK" \
            -miphoneos-version-min=14.0 -fobjc-arc \
            -framework Foundation -framework UIKit \
            -o "$APP/HighFPSMax" HighFPSMax/App/main.m
          cp HighFPSMax/App/Info.plist "$APP/Info.plist"
          codesign --force --sign - --entitlements HighFPSMax/entitlements.plist "$APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/HighFPSMax.app
          (cd build && zip -qry ../artifacts/HighFPSMax.ipa Payload -x "*.DS_Store")
          echo "IPA: $(du -h artifacts/HighFPSMax.ipa | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: HighFPSMax-artifacts
          path: artifacts/
