name: Build SIOriginal (dylib + IPA)

on:
  workflow_dispatch:
  push:
    tags: [ 'sioriginal-v*' ]

permissions:
  contents: write

jobs:
  build:
    name: Build SIOriginal dylib + IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # ① dylib — pw5a29 Speed Intensifier 10.1-1 机制重制（纯 runtime，无 Substrate）
      - name: Build dylib (pure clang)
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          mkdir -p artifacts
          clang -arch arm64 -dynamiclib -O2 \
            -install_name @rpath/SIOriginal.dylib \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -undefined dynamic_lookup -fobjc-arc \
            -framework Foundation -framework UIKit -framework QuartzCore -framework Metal \
            -o artifacts/SIOriginal.dylib SIOriginal/Tweak/SIOriginal.m
          codesign --force --sign - artifacts/SIOriginal.dylib
          lipo -info artifacts/SIOriginal.dylib
          file artifacts/SIOriginal.dylib
          echo "dylib size: $(du -h artifacts/SIOriginal.dylib | cut -f1)"

      # ② 配置 App IPA
      - name: Build app & IPA
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          APP="build/SIOriginal.app"
          rm -rf build
          mkdir -p "$APP"

          clang -arch arm64 -O2 \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -fobjc-arc \
            -framework Foundation -framework UIKit \
            -o "$APP/SIOriginal" SIOriginal/App/main.m

          cp SIOriginal/App/Info.plist "$APP/Info.plist"
          cp SIOriginal/App/AppIcon.png "$APP/AppIcon.png"
          for f in SIOriginal/App/Icon-*.png; do cp "$f" "$APP/$(basename $f)"; done
          codesign --force --sign - --entitlements SIOriginal/entitlements.plist "$APP"

          mkdir -p build/Payload
          cp -R "$APP" build/Payload/SIOriginal.app
          ( cd build && zip -qry ../artifacts/SIOriginal.ipa Payload -x "*.DS_Store" )
          echo "IPA size: $(du -h artifacts/SIOriginal.ipa | cut -f1)"

      - name: Verify artifacts
        run: |
          set -e
          ls -lh artifacts/
          file artifacts/SIOriginal.dylib
          unzip -l artifacts/SIOriginal.ipa

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SIOriginal-artifacts
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/sioriginal-v')
        uses: softprops/action-gh-release@v2
        with:
          name: SIOriginal ${{ github.ref_name }}
          files: |
            artifacts/SIOriginal.dylib
            artifacts/SIOriginal.ipa
          generate_release_notes: true
