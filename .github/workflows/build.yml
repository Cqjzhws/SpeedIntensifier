name: Build SpeedIntensifier (dylib + IPA)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    name: Build dylib + IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # ==========================================================
      # ① dylib — 纯 clang，无 substrate，可 TrollFools 注入
      # ==========================================================
      - name: Build dylib (pure clang)
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          mkdir -p artifacts
          clang -arch arm64 -dynamiclib -O2 \
            -install_name @rpath/SpeedIntensifier.dylib \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -undefined dynamic_lookup -fobjc-arc \
            -framework Foundation -framework UIKit -framework QuartzCore \
            -o artifacts/SpeedIntensifier.dylib Tweak/Tweak.m
          # ad-hoc 签名，TrollFools 注入更稳
          codesign --force --sign - artifacts/SpeedIntensifier.dylib
          lipo -info artifacts/SpeedIntensifier.dylib
          file artifacts/SpeedIntensifier.dylib
          echo "dylib size: $(du -h artifacts/SpeedIntensifier.dylib | cut -f1)"

      # ==========================================================
      # ② IPA — clang 直编 .app，codesign 加 entitlements 后打包
      # ==========================================================
      - name: Build app & IPA
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          APP="build/SpeedIntensifier.app"
          rm -rf build
          mkdir -p "$APP"

          clang -arch arm64 -O2 \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -fobjc-arc \
            -framework Foundation -framework UIKit \
            -o "$APP/SpeedIntensifier" App/main.m

          cp App/Info.plist "$APP/Info.plist"
          cp App/AppIcon.png "$APP/AppIcon.png"
          for f in App/Icon-*.png; do cp "$f" "$APP/$(basename $f)"; done
          codesign --force --sign - --entitlements entitlements.plist "$APP"
          echo "--- entitlements ---"
          codesign -d --entitlements - "$APP" 2>&1 | head -20 || true

          mkdir -p build/Payload
          cp -R "$APP" build/Payload/SpeedIntensifier.app
          ( cd build && zip -qry ../artifacts/SpeedIntensifier.ipa Payload -x "*.DS_Store" )
          echo "IPA size: $(du -h artifacts/SpeedIntensifier.ipa | cut -f1)"

      - name: Verify artifacts
        run: |
          set -e
          ls -lh artifacts/
          file artifacts/SpeedIntensifier.dylib
          codesign -dv artifacts/SpeedIntensifier.dylib 2>&1 | head -5 || true
          unzip -l artifacts/SpeedIntensifier.ipa

      # 诊断：核对 runner 端源码与产物二进制中的字符串，定位"源码有但二进制无"问题
      - name: Debug source & binary strings
        run: |
          echo "=== md5 sources ==="
          md5 App/main.m Tweak/Tweak.m
          echo "=== markers in source ==="
          grep -c "iPhone18" App/main.m || true
          grep -c "FolderAccel" App/main.m Tweak/Tweak.m || true
          echo "=== ASCII strings in app binary ==="
          strings build/SpeedIntensifier.app/SpeedIntensifier | grep -Ei "hooks|1\.5\.|iPhone18|FolderAccel" || echo "(no marker ASCII strings found)"
          echo "=== CFString literals (objdump) ==="
          otool -v -s __DATA __cfstring build/SpeedIntensifier.app/SpeedIntensifier 2>/dev/null | head -30 || true
          echo "=== Info.plist in .app ==="
          plutil -p build/SpeedIntensifier.app/Info.plist | grep -E "Version|DisplayName" || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SpeedIntensifier-artifacts
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

      # ==========================================================
      # ③ 打 v* tag 时自动发布 Release（IPA + dylib）
      # ==========================================================
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: SpeedIntensifier ${{ github.ref_name }}
          files: |
            artifacts/SpeedIntensifier.dylib
            artifacts/SpeedIntensifier.ipa
          generate_release_notes: true
