name: Build AwemeMax (dylib + IPA)

on:
  workflow_dispatch:
  push:
    tags: [ 'awememax-v*' ]

permissions:
  contents: write

jobs:
  build:
    name: Build AwemeMax dylib + IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # ① dylib — 抖音全屏+下载二合一（纯 runtime，无 Substrate）
      - name: Build dylib (pure clang)
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          mkdir -p artifacts
          clang -arch arm64 -dynamiclib -O2 \
            -install_name @rpath/AwemeMax.dylib \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -undefined dynamic_lookup -fobjc-arc \
            -framework Foundation -framework UIKit -framework AVFoundation -framework Photos \
            -o artifacts/AwemeMax.dylib AwemeMax/Tweak/AwemeMax.m
          codesign --force --sign - artifacts/AwemeMax.dylib
          lipo -info artifacts/AwemeMax.dylib
          file artifacts/AwemeMax.dylib
          echo "dylib size: $(du -h artifacts/AwemeMax.dylib | cut -f1)"

      # ② 配置 App IPA
      - name: Build app & IPA
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          APP="build/AwemeMax.app"
          rm -rf build
          mkdir -p "$APP"

          clang -arch arm64 -O2 \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -fobjc-arc \
            -framework Foundation -framework UIKit \
            -o "$APP/AwemeMax" AwemeMax/App/main.m

          cp AwemeMax/App/Info.plist "$APP/Info.plist"
          codesign --force --sign - --entitlements AwemeMax/entitlements.plist "$APP"

          mkdir -p build/Payload
          cp -R "$APP" build/Payload/AwemeMax.app
          ( cd build && zip -qry ../artifacts/AwemeMax.ipa Payload -x "*.DS_Store" )
          echo "IPA size: $(du -h artifacts/AwemeMax.ipa | cut -f1)"

      - name: Verify artifacts
        run: |
          set -e
          ls -lh artifacts/
          file artifacts/AwemeMax.dylib
          unzip -l artifacts/AwemeMax.ipa

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AwemeMax-artifacts
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/awememax-v')
        uses: softprops/action-gh-release@v2
        with:
          name: AwemeMax ${{ github.ref_name }}
          files: |
            artifacts/AwemeMax.dylib
            artifacts/AwemeMax.ipa
          generate_release_notes: true
