name: Build Helium Max
on:
  push:
    tags: ['heliummax-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CC=$(xcrun -sdk iphoneos -f clang)
          mkdir -p build/Payload/HeliumMax.app

          $CC -arch arm64 -O2 -isysroot "$SDK" \
            -fobjc-arc -fmodules \
            -I HeliumMax -I HeliumMax/HUD -I HeliumMax/App \
            -miphoneos-version-min=14.0 \
            -framework UIKit -framework Foundation -framework AVFoundation \
            -framework CoreTelephony -framework IOKit \
            -framework CoreGraphics -framework QuartzCore \
            -o build/Payload/HeliumMax.app/HeliumMax \
            HeliumMax/App/main.m HeliumMax/HUD/HUDWidget.m HeliumMax/HUD/HUDManager.m

          cp HeliumMax/App/Info.plist build/Payload/HeliumMax.app/Info.plist

          codesign --force --sign - --entitlements HeliumMax/entitlements.plist build/Payload/HeliumMax.app/HeliumMax

          file build/Payload/HeliumMax.app/HeliumMax
          (cd build && zip -qry ../HeliumMax.ipa Payload -x "*.DS_Store")
          mkdir -p artifacts
          cp HeliumMax.ipa artifacts/
          ls -lh artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: HeliumMax-artifacts
          path: artifacts/
