name: Build AwemeFullScreen (dylib only)

on:
  workflow_dispatch:
  push:
    tags: [ 'awemefullscreen-v*' ]

permissions:
  contents: write

jobs:
  build:
    name: Build AwemeFullScreen dylib (+ diag)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # 抖音全屏：纯 ObjC runtime，无 CydiaSubstrate
      # 同一份源码编两份：
      #   AwemeFullScreen.dylib       正式版，无任何屏幕文字
      #   AwemeFullScreen-Diag.dylib  诊断版（-DAFS_DIAG=1），顶部叠加几何报告
      - name: Build dylibs (pure clang)
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          mkdir -p artifacts
          COMMON="-arch arm64 -dynamiclib -O2 -isysroot $SDK -miphoneos-version-min=14.0 \
            -undefined dynamic_lookup -fobjc-arc \
            -framework Foundation -framework UIKit -framework CoreGraphics -framework CoreFoundation"

          clang $COMMON -install_name @rpath/AwemeFullScreen.dylib \
            -o artifacts/AwemeFullScreen.dylib AwemeFullScreen/Tweak/AwemeFullScreen.m

          clang $COMMON -DAFS_DIAG=1 -install_name @rpath/AwemeFullScreen-Diag.dylib \
            -o artifacts/AwemeFullScreen-Diag.dylib AwemeFullScreen/Tweak/AwemeFullScreen.m

          codesign --force --sign - artifacts/AwemeFullScreen.dylib
          codesign --force --sign - artifacts/AwemeFullScreen-Diag.dylib
          lipo -info artifacts/AwemeFullScreen.dylib
          lipo -info artifacts/AwemeFullScreen-Diag.dylib
          ls -lh artifacts/

      - name: Verify artifacts (must not link CydiaSubstrate)
        run: |
          set -e
          for f in artifacts/AwemeFullScreen.dylib artifacts/AwemeFullScreen-Diag.dylib; do
            echo "--- $f"
            file "$f"
            otool -L "$f"
            if otool -L "$f" | grep -qi substrate; then
              echo "ERROR: CydiaSubstrate dependency found in $f"; exit 1
            fi
          done
          echo "OK: no Substrate dependency in either dylib"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AwemeFullScreen-artifacts
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/awemefullscreen-v')
        uses: softprops/action-gh-release@v2
        with:
          name: AwemeFullScreen ${{ github.ref_name }}
          files: |
            artifacts/AwemeFullScreen.dylib
            artifacts/AwemeFullScreen-Diag.dylib
          generate_release_notes: true
