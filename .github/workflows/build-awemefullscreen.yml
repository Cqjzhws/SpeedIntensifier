name: Build AwemeFullScreen (dylib only)

on:
  workflow_dispatch:
  push:
    tags: [ 'awemefullscreen-v*' ]

permissions:
  contents: write

jobs:
  build:
    name: Build AwemeFullScreen dylib
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # 抖音全屏：纯 ObjC runtime，无 CydiaSubstrate，无配置 App，无任何屏幕文字
      - name: Build dylib (pure clang)
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          mkdir -p artifacts
          clang -arch arm64 -dynamiclib -O2 \
            -install_name @rpath/AwemeFullScreen.dylib \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -undefined dynamic_lookup -fobjc-arc \
            -framework Foundation -framework UIKit -framework CoreGraphics -framework CoreFoundation \
            -o artifacts/AwemeFullScreen.dylib AwemeFullScreen/Tweak/AwemeFullScreen.m
          codesign --force --sign - artifacts/AwemeFullScreen.dylib
          lipo -info artifacts/AwemeFullScreen.dylib
          file artifacts/AwemeFullScreen.dylib
          echo "dylib size: $(du -h artifacts/AwemeFullScreen.dylib | cut -f1)"
          echo "--- must NOT link CydiaSubstrate ---"
          otool -L artifacts/AwemeFullScreen.dylib

      - name: Verify artifacts
        run: |
          set -e
          ls -lh artifacts/
          file artifacts/AwemeFullScreen.dylib
          if otool -L artifacts/AwemeFullScreen.dylib | grep -qi substrate; then
            echo "ERROR: CydiaSubstrate dependency found"; exit 1
          fi
          echo "OK: no Substrate dependency"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AwemeFullScreen-artifacts
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/awemefullscreen-v')
        uses: softprops/action-gh-release@v2
        with:
          name: AwemeFullScreen ${{ github.ref_name }}
          files: |
            artifacts/AwemeFullScreen.dylib
          generate_release_notes: true
