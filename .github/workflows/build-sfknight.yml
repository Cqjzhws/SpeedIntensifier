name: Build SFKnightMax (dylib only)

on:
  workflow_dispatch:
  push:
    tags: [ 'sfknight-v*' ]

permissions:
  contents: write

jobs:
  build:
    name: Build SFKnightMax dylib
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # dylib — 顺丰同城骑士升级弹窗屏蔽 (纯 runtime, 无 Substrate)
      - name: Build dylib (pure clang)
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          mkdir -p artifacts
          clang -arch arm64 -dynamiclib -O2 \
            -install_name @rpath/SFKnightMax.dylib \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -undefined dynamic_lookup -fobjc-arc \
            -framework Foundation \
            -o artifacts/SFKnightMax.dylib SFKnightMax/Tweak/SFKnightMax.m
          codesign --force --sign - artifacts/SFKnightMax.dylib
          lipo -info artifacts/SFKnightMax.dylib
          file artifacts/SFKnightMax.dylib
          echo "dylib size: $(du -h artifacts/SFKnightMax.dylib | cut -f1)"

      - name: Verify artifacts
        run: |
          set -e
          ls -lh artifacts/
          file artifacts/SFKnightMax.dylib

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SFKnightMax-artifacts
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/sfknight-v')
        uses: softprops/action-gh-release@v2
        with:
          name: SFKnightMax ${{ github.ref_name }}
          files: |
            artifacts/SFKnightMax.dylib
          generate_release_notes: true
